name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: List available simulators (debug)
        run: xcrun simctl list devices available

      - name: Find simulator UDID
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone")) | select(.isAvailable) | .udid' | head -n 1)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator UDID: $UDID"

      - name: Run tests
        run: |
          xcodebuild test \
            -project swiftDataToDo/swiftDataToDo.xcodeproj \
            -scheme swiftDataToDo \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults