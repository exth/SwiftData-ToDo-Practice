name: iOS CI

on: push

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build and Test
        run: |
          xcodebuild test \
            -project swiftDataToDo/swiftDataToDo.xcodeproj \
            -scheme swiftDataToDo \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults